name: receipt_scanner
description: OCR Expense Tracker & Receipt Parser
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # ML Kit OCR
  google_mlkit_text_recognition: ^0.13.0
  # Camera
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.2.0
  # Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  # Permissions
  permission_handler: ^11.3.1
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
